name: Website checks

on:
  push:
    branches: [main, mirzo]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mone_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: mone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mone_test -d mone_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        env:
          CSV_TEST_POSTGRES_URL: postgresql+asyncpg://mone_test:test_only_password@localhost:5432/mone_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
