name: Deploy Mone Bot to Oracle Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: pip install -r requirements-dev.txt

      - name: Backend tests
        run: python -m unittest discover -s tests -v

  deploy:
    name: Deploy to Oracle Cloud
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Starting deployment on Oracle Cloud..."
            cd /opt/mone

            echo "Backing up PostgreSQL before deployment..."
            umask 077
            mkdir -p backups
            chmod 700 backups
            if [ -n "$(sudo docker compose ps -q db)" ]; then
              backup_file="backups/predeploy-$(date -u +%Y%m%dT%H%M%SZ).dump"
              sudo docker compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$backup_file"
              test -s "$backup_file"
              sudo docker compose exec -T db pg_restore --list < "$backup_file" > /dev/null
              echo "Database backup created and validated."
            fi

            umask 022
            echo "📥 Pulling latest changes from GitHub..."
            git fetch origin main
            git checkout main
            git merge --ff-only origin/main

            echo "🐳 Rebuilding and restarting bot container..."
            sudo docker compose up -d --build --remove-orphans

            echo "Checking bot startup..."
            for attempt in $(seq 1 30); do
              bot_id="$(sudo docker compose ps -q bot)"
              if [ -n "$bot_id" ] && [ "$(sudo docker inspect --format '{{.State.Running}}' "$bot_id")" = "true" ] && sudo docker compose logs --no-color --tail 100 bot 2>&1 | grep -q 'Startup complete\.'; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Bot did not complete startup. Configuration values are not printed."
                exit 1
              fi
              sleep 2
            done
            echo "✅ Deployment completed successfully!"
            sudo docker compose ps
